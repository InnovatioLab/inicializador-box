#cloud-config
autoinstall:
  version: 1
  identity:
    realname: "José Santos"
    hostname: ubuntu-desktop
    username: telas
    password: "$y$j9T$OhqrINdty2I6i4C6p6Mxc.$voXUZ4zGpvnMFggMVHWkoP3hwu1w94oQPyt7DisUxp0"
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: "America/New_York"
  packages:
    - ca-certificates
    - curl
    - git
    - gnupg
    - jq
    - wget
  codecs:
    install: true
  drivers:
    install: true
  ssh:
    install-server: true
    authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBPoeRr1TEfBSiZTjZoWIRvFh/k6e+zJmov2uO5R61M4 victoremmanuelmn@gmail.com
      - ssh-rsa  kevindiegodasilvasousa@gmail.com
  updates: all
  shutdown: reboot
  late-commands:
    - |
      mkdir -p /target/root/inicializador-box
      chroot /target /bin/bash -c 'cd /root && rm -rf inicializador-box && mkdir -p inicializador-box && curl -fsSL "https://github.com/InnovatioLab/inicializador-box/archive/refs/heads/main.tar.gz" | tar -xz --strip-components=1 -C /root/inicializador-box'
    - |
      chroot /target /bin/bash -c 'cat > /etc/systemd/system/box-firstboot.service << "EOF"
      [Unit]
      Description=Run box bootstrap on first boot
      ConditionPathExists=/root/inicializador-box/setup_dev_machine.sh
      ConditionPathExists=!/etc/box/bootstrap.complete
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash /root/inicializador-box/setup_dev_machine.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
      EOF'
    - chroot /target /bin/bash -c 'chmod 644 /etc/systemd/system/box-firstboot.service'
    - chroot /target /bin/bash -c 'systemctl enable box-firstboot.service || true'
