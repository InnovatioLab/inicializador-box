autoinstall:
  version: 1

  identity:
    realname: "Telas Box"
    hostname: telas-box
    username: telas
    password: "$y$j9T$OhqrINdty2I6i4C6p6Mxc.$voXUZ4zGpvnMFggMVHWkoP3hwu1w94oQPyt7DisUxp0"

  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: "America/New_York"

  storage:
    layout:
      name: lvm

  packages:
    - ca-certificates
    - curl
    - git
    - gnupg
    - jq
    - wget

  codecs:
    install: true
  drivers:
    install: true

  ssh:
    install-server: true
    authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBPoeRr1TEfBSiZTjZoWIRvFh/k6e+zJmov2uO5R61M4 victoremmanuelmn@gmail.com
      - ssh-rsa  kevindiegodasilvasousa@gmail.com

  updates: all
  shutdown: reboot

  late-commands:
    - chroot /target bash -c 'mkdir -p /root/inicializador-box && curl -fsSL "https://github.com/InnovatioLab/inicializador-box/archive/refs/heads/main.tar.gz" | tar -xz --strip-components=1 -C /root/inicializador-box'
    - chroot /target bash -c 'printf "[Unit]\nDescription=Bootstrap da telas box no primeiro boot\nConditionPathExists=/root/inicializador-box/setup_dev_machine.sh\nConditionPathExists=!/etc/box/bootstrap.complete\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nType=oneshot\nExecStart=/bin/bash /root/inicializador-box/setup_dev_machine.sh\nRemainAfterExit=yes\n\n[Install]\nWantedBy=multi-user.target\n" > /etc/systemd/system/box-firstboot.service'
    - chroot /target bash -c 'chmod 644 /etc/systemd/system/box-firstboot.service && systemctl enable box-firstboot.service'
